<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Yönetici Girişi | Mamon Estate</title><link rel="icon" href="assets/images/mamon-estate-icon.png"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/branding.css"><link rel="stylesheet" href="assets/css/auth.css"><link rel="stylesheet" href="assets/css/admin-login.css"></head>
<body><div id="siteHeader"></div><main class="auth-main"><section class="auth-card"><img src="assets/images/mamon-estate-icon.png" alt="Mamon Estate" class="auth-logo"><h1>Yönetim paneli</h1><p>İlanları, bölgeleri ve site ayarlarını yönetmek için güvenli giriş yapın.</p><div id="loginMessage" class="auth-message" hidden></div><form class="auth-form" method="post" action="/admin-oturum/login"><label>Kullanıcı adı<input name="username" autocomplete="username" required autofocus></label><label>Şifre<input type="password" name="password" autocomplete="current-password" required></label><label class="remember"><input type="checkbox" name="remember" value="1"><span>Bu cihazda oturumu açık tut</span></label><button class="auth-button" type="submit">Yönetim paneline gir</button></form><div class="auth-meta"><a href="/">← Siteye dön</a></div></section></main><script>const s=new URLSearchParams(location.search).get('hata');if(s){const m=document.querySelector('#loginMessage');m.hidden=false;m.textContent=s==='bekleyin'?'Çok fazla deneme yapıldı. Lütfen 5 dakika bekleyin.':'Kullanıcı adı veya şifre hatalı.'}</script><script src="assets/js/page-shell.js"></script></body></html>
