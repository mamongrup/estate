services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: mamon_estate
      POSTGRES_USER: mamon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mamon_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mamon -d mamon_estate"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://mamon:${POSTGRES_PASSWORD:-mamon_dev}@postgres:5432/mamon_estate
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STATIC_ROOT: /app/public
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  postgres_data:
