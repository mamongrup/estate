# Sadece Gleam'in sunması gereken yolları proxy'le
# PHP dosyaları ve API'lar Apache tarafından sunulur

# Health check
location /health {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
}

# Statik dosyalar (CSS, JS, görseller)
location /assets/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
}

# robots.txt
location = /robots.txt {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
}

# Clean URL'ler (ilan/satilik/kiralik etc.) → Gleam
location ~ ^/(satilik|kiralik|bolgeler|hakkimizda|iletisim|kvkk|gizlilik|uye-girisi|uye-ol|sifremi-unuttum|sifre-yenile|ilan)/?$ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
}

# Ana sayfa
location = / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
}

# Geri kalan her şey (API, admin, PHP) → Apache (default behavior)
# proxy_pass tanımlanmamış → nginx varsayılan DocumentRoot'a yönlendirir
